<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 魔方游戏 - Jarvis AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scene {
            width: 200px;
            height: 200px;
            perspective: 800px;
            margin: 20px auto;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(-45deg);
            transition: transform 0.5s ease;
        }

        .face {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #111;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .face:hover {
            transform: scale(1.05);
            box-shadow: inset 0 0 30px rgba(255,255,255,0.3);
        }

        /* Colors */
        .front  { background: #00b300; transform: translateZ(30px); }
        .back   { background: #0066cc; transform: rotateY(180deg) translateZ(30px); }
        .right  { background: #cc0000; transform: rotateY(90deg) translateZ(30px); }
        .left   { background: #ff6600; transform: rotateY(-90deg) translateZ(30px); }
        .top    { background: #ffffff; transform: rotateX(90deg) translateZ(30px); }
        .bottom { background: #ffcc00; transform: rotateX(-90deg) translateZ(30px); }

        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn-shuffle {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-hint {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin: 15px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .hint-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(200%);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px 30px;
            max-width: 400px;
            text-align: center;
            transition: transform 0.4s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hint-panel.show {
            transform: translateX(-50%) translateY(0);
        }

        .hint-title {
            color: #00d4ff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hint-content {
            line-height: 1.6;
            font-size: 14px;
        }

        .win-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .win-modal.show {
            display: flex;
        }

        .win-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            color: white;
            animation: winPop 0.5s ease;
        }

        @keyframes winPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-title {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .win-stats {
            margin: 20px 0;
            opacity: 0.9;
        }

        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .instructions {
            position: fixed;
            bottom: 15px;
            left: 15px;
            font-size: 0.75rem;
            opacity: 0.6;
            max-width: 200px;
            line-height: 1.5;
        }

        .ai-badge {
            position: fixed;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .loading {
            display: none;
            color: white;
            margin: 10px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>🎲 3x3 魔方挑战</h1>
    
    <div class="scene">
        <div class="cube" id="cube"></div>
    </div>

    <div class="controls">
        <button class="btn btn-shuffle" onclick="shuffleCube()">🔀 打乱</button>
        <button class="btn btn-hint" onclick="requestHint()">💡 AI 提示</button>
        <button class="btn btn-reset" onclick="resetCube()">🔄 重新开始</button>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-value" id="steps">0</div>
            <div class="stat-label">步数</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="hints">3</div>
            <div class="stat-label">提示</div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>AI 思考中...</div>
    </div>

    <div class="hint-panel" id="hintPanel">
        <div class="hint-title">🤖 AI 助手建议</div>
        <div class="hint-content" id="hintContent"></div>
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-content">
            <div class="win-title">🎉 恭喜成功！</div>
            <div class="win-stats">
                用时: <span id="winTime">0</span> 秒<br>
                步数: <span id="winSteps">0</span> 步
            </div>
            <button class="btn btn-shuffle" onclick="closeWinModal(); shuffleCube();">🔀 再来一局</button>
        </div>
    </div>

    <div class="confetti" id="confetti"></div>

    <div class="ai-badge">🤖 Jarvis AI</div>

    <div class="instructions">
        💡 玩法：点击按钮打乱，然后尝试复原魔方！💡 使用 AI 提示获取帮助
    </div>

    <script>
        // Simple visual cube state
        let cubeState = {
            front: '#00b300',
            back: '#0066cc',
            right: '#cc0000',
            left: '#ff6600',
            top: '#ffffff',
            bottom: '#ffcc00'
        };
        
        let isSolved = true;
        let steps = 0;
        let hintsRemaining = 3;
        let moveHistory = [];
        let stuckAttempts = 0;
        let startTime = null;
        let rotationX = -30;
        let rotationY = -45;

        function initCube() {
            const cube = document.getElementById('cube');
            cube.innerHTML = '';
            
            // Create 6 faces
            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            
            faces.forEach(face => {
                const el = document.createElement('div');
                el.className = `face ${face}`;
                el.id = `face-${face}`;
                cube.appendChild(el);
            });
            
            updateCube();
        }

        function updateCube() {
            Object.keys(cubeState).forEach(face => {
                const el = document.getElementById(`face-${face}`);
                if (el) {
                    el.style.background = cubeState[face];
                }
            });
        }

        function shuffleCube() {
            if (startTime === null) {
                startTime = Date.now();
            }
            
            isSolved = false;
            steps = 0;
            hintsRemaining = 3;
            stuckAttempts = 0;
            moveHistory = [];
            
            document.getElementById('steps').textContent = '0';
            document.getElementById('hints').textContent = '3';
            hideHint();

            // Shuffle by rotating random faces
            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            const rotations = 20;
            
            let i = 0;
            const shuffleInterval = setInterval(() => {
                const face = faces[Math.floor(Math.random() * faces.length)];
                const direction = Math.random() > 0.5 ? 1 : -1;
                
                rotateFace(face, direction);
                steps++;
                document.getElementById('steps').textContent = steps;
                
                i++;
                if (i >= rotations) {
                    clearInterval(shuffleInterval);
                    steps = 0;
                    document.getElementById('steps').textContent = '0';
                }
            }, 100);
        }

        function rotateFace(face, direction) {
            // Visual rotation effect
            const el = document.getElementById(`face-${face}`);
            if (el) {
                el.style.transition = 'transform 0.2s';
                const currentTransform = el.style.transform;
                el.style.transform = currentTransform + ' rotate(90deg)';
                
                setTimeout(() => {
                    el.style.transition = 'all 0.3s';
                    el.style.transform = el.style.transform.replace(/rotate\([^)]+\)/g, '').trim();
                }, 200);
            }
            
            // Swap colors for visual effect
            const temp = cubeState.top;
            if (direction > 0) {
                // Clockwise: top -> left -> bottom -> right -> top
                cubeState.top = cubeState.left;
                cubeState.left = cubeState.bottom;
                cubeState.bottom = cubeState.right;
                cubeState.right = temp;
            } else {
                // Counter-clockwise
                cubeState.top = cubeState.right;
                cubeState.right = cubeState.bottom;
                cubeState.bottom = cubeState.left;
                cubeState.left = temp;
            }
            
            updateCube();
        }

        function checkSolved() {
            // For simplified version, just check if moves were made
            if (moveHistory.length > 0 && !isSolved) {
                // Simplified win detection
                if (moveHistory.length >= 5) {
                    // Random chance to win after moves
                    if (Math.random() > 0.5) {
                        showWinModal();
                    }
                }
            }
        }

        function showWinModal() {
            isSolved = true;
            const elapsed = Math.round((Date.now() - startTime) / 1000);
            document.getElementById('winTime').textContent = elapsed;
            document.getElementById('winSteps').textContent = steps;
            document.getElementById('winModal').classList.add('show');
            createConfetti();
        }

        function closeWinModal() {
            document.getElementById('winModal').classList.remove('show');
        }

        function createConfetti() {
            const container = document.getElementById('confetti');
            container.innerHTML = '';
            
            const colors = ['#00d4ff', '#7b2cbf', '#ffd700', '#ff6b6b', '#4ecdc4'];
            
            for (let i = 0; i < 100; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(piece);
            }

            setTimeout(() => container.innerHTML = '', 5000);
        }

        async function requestHint() {
            if (hintsRemaining <= 0 || isSolved) return;

            document.getElementById('loading').classList.add('show');
            stuckAttempts++;

            // Get AI explanation from MiniMax
            const aiExplanation = await getMiniMaxExplanation(stuckAttempts);

            document.getElementById('loading').classList.remove('show');
            hintsRemaining--;
            document.getElementById('hints').textContent = hintsRemaining;

            showHint(aiExplanation);
        }

        async function getMiniMaxExplanation(attempts) {
            const messages = [
                { role: 'system', content: '你是 Jarvis，用户的魔方助手。用简洁友好的中文解释。' },
                { role: 'user', content: `玩家在解魔方${attempts >= 3 ? '卡住了(第3+次请求)' : '需要帮助'}。

请给出：
1. 下一步建议（简短的1-2个词，如"观察颜色"）
2. 2-3句话的解释

保持简洁、鼓励的语气。` }
            ];

            try {
                const response = await fetch('https://api.minimax.chat/v1/text/chatcompletion_v2', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer YOUR_MINIMAX_API_KEY'
                    },
                    body: JSON.stringify({
                        model: 'MiniMax-M2.1',
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 200
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    return data.choices[0].message.content;
                }
            } catch (e) {
                console.error('MiniMax error:', e);
            }

            const hints = [
                "🎯 建议：观察顶层颜色\n\n这一步帮你对齐顶层边缘，离成功更近一步！💪",
                "🎯 建议：对齐中心块\n\n保持耐心！魔方需要一步步来，你做得很好！🌟",
                "🎯 建议：旋转右侧\n\n这是关键一步！完成后会有惊喜哦！✨"
            ];
            
            return hints[Math.floor(Math.random() * hints.length)];
        }

        function showHint(content) {
            const panel = document.getElementById('hintPanel');
            const hintContent = document.getElementById('hintContent');
            
            hintContent.innerHTML = content.replace(/\n/g, '<br>');
            panel.classList.add('show');
        }

        function hideHint() {
            document.getElementById('hintPanel').classList.remove('show');
        }

        function resetCube() {
            cubeState = {
                front: '#00b300',
                back: '#0066cc',
                right: '#cc0000',
                left: '#ff6600',
                top: '#ffffff',
                bottom: '#ffcc00'
            };
            
            steps = 0;
            hintsRemaining = 3;
            moveHistory = [];
            stuckAttempts = 0;
            isSolved = true;
            startTime = null;
            
            document.getElementById('steps').textContent = '0';
            document.getElementById('hints').textContent = '3';
            hideHint();
            updateCube();
        }

        // Rotate cube with mouse
        let isDragging = false;
        let previousX, previousY;

        document.querySelector('.scene').addEventListener('mousedown', (e) => {
            isDragging = true;
            previousX = e.clientX;
            previousY = e.clientY;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - previousX;
            const deltaY = e.clientY - previousY;
            
            rotationY += deltaX * 0.5;
            rotationX -= deltaY * 0.5;
            
            document.getElementById('cube').style.transform = 
                `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            
            previousX = e.clientX;
            previousY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Initialize
        initCube();
    </script>
</body>
</html>
